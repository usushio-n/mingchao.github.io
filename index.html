<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1314">
  <meta name="description" content="一份 20 题的鸣潮同人角色人格测试。测出你的五维倾向，找到与你同频的共鸣者。">
  <title>共鸣档案 · 鸣潮角色人格测试</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="./">
        <span class="signal-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span><strong>共鸣档案</strong><small lang="en">RESONANCE ARCHIVE</small></span>
      </a>
      <ol class="stages" aria-label="测试阶段">
        <li data-stage="home" aria-current="step">开始</li>
        <li data-stage="quiz">答题</li>
        <li data-stage="result">结果</li>
      </ol>
      <a class="source-link" href="https://github.com/usushio-n/mingchao.github.io">GitHub <span aria-hidden="true">↗</span></a>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <noscript><p class="notice">启用 JavaScript 后即可开始测试。</p></noscript>
    <section class="hero" id="home" aria-labelledby="home-title">
      <div class="hero-copy">
        <p class="eyebrow">鸣潮角色人格测试</p>
        <h1 id="home-title" tabindex="-1">如果共鸣有形，<br>你会是谁<span class="accent">？</span></h1>
        <p class="intro">用 20 道题描摹你的性格频谱，<br class="wide-only">找到与你同频的《鸣潮》共鸣者。</p>
        <button class="button button-primary start-button" id="start" type="button">开始测试 <span aria-hidden="true">↗</span></button>
        <ul class="hero-meta">
          <li><strong>约 3 分钟</strong><span>测试时长</span></li>
          <li><strong><span id="character-count">51</span> 位</strong><span>角色候选</span></li>
          <li><strong>普通话</strong><span>结果自动播放</span></li>
        </ul>
      </div>
      <figure class="hero-figure">
        <div class="frequency-ring" aria-hidden="true"></div>
        <div class="art-scale" aria-hidden="true"></div>
        <img src="./assets/portraits/1304.webp" width="798" height="1100" alt="" fetchpriority="high">
        <figcaption><span class="caption-mark" aria-hidden="true"></span><span><strong>今汐</strong><small lang="en">JINHSI</small></span></figcaption>
      </figure>
    </section>

    <section class="quiz" id="quiz" aria-labelledby="question-title" hidden>
      <div class="section-intro">
        <h2>共鸣测试</h2>
        <p>按你平时的情况选择最贴近的一项。</p>
      </div>
      <form class="quiz-card" id="quiz-form">
        <div class="quiz-progress">
          <p>第 <strong id="question-number"></strong> / <span id="question-total"></span> 题</p>
          <p id="answer-count"></p>
        </div>
        <progress id="progress" aria-label="已回答题目"></progress>
        <h3 id="question-title" tabindex="-1"></h3>
        <fieldset aria-labelledby="question-title">
          <label class="option" for="answer-1"><input id="answer-1" type="radio" name="answer" value="1" required><span>非常不符合</span></label>
          <label class="option" for="answer-2"><input id="answer-2" type="radio" name="answer" value="2"><span>比较不符合</span></label>
          <label class="option" for="answer-3"><input id="answer-3" type="radio" name="answer" value="3"><span>说不准</span></label>
          <label class="option" for="answer-4"><input id="answer-4" type="radio" name="answer" value="4"><span>比较符合</span></label>
          <label class="option" for="answer-5"><input id="answer-5" type="radio" name="answer" value="5"><span>非常符合</span></label>
        </fieldset>
        <div class="quiz-actions">
          <button class="button button-quiet" id="previous" type="button"><span aria-hidden="true">←</span> 上一题</button>
          <button class="button button-primary" id="next" type="submit"><span id="next-label">下一题</span> <span aria-hidden="true">→</span></button>
        </div>
      </form>
    </section>

    <section class="result" id="result" aria-labelledby="result-title" hidden>
      <article class="result-card">
        <div class="result-copy">
          <p class="eyebrow">你的共鸣角色</p>
          <h2 id="result-title" tabindex="-1"></h2>
          <p class="result-type" id="result-type"></p>
          <p class="result-description" id="match-reason"></p>
          <div class="voice-panel">
            <p class="voice-transcript" id="voice-transcript"></p>
            <div class="voice-actions">
              <button class="button button-primary" id="replay" type="button"><span id="replay-label">播放语音</span> <span aria-hidden="true">▶</span></button>
              <button class="button button-secondary" id="pause" type="button" disabled>暂停</button>
            </div>
            <p class="status" id="voice-status" role="status"></p>
            <audio id="character-voice" preload="none"></audio>
          </div>
        </div>
        <figure class="result-figure">
          <div class="frequency-ring" aria-hidden="true"></div>
          <img id="portrait" alt="" hidden>
          <figcaption id="portrait-error" hidden>立绘暂时无法加载。</figcaption>
        </figure>
      </article>

      <div class="result-details">
        <section class="spectrum" aria-labelledby="spectrum-title">
          <h3 id="spectrum-title">你的性格频谱</h3>
          <p>五项分数由答题结果换算为 0–100，同一维度的两端各有特点。</p>
          <dl class="traits" id="traits"></dl>
        </section>
        <div class="result-actions">
          <button class="button button-secondary" id="share" type="button">分享结果 <span aria-hidden="true">↗</span></button>
          <button class="button button-quiet" id="retry" type="button">重新测试 <span aria-hidden="true">↻</span></button>
        </div>
        <label class="share-fallback" id="share-fallback" hidden>手动复制分享内容
          <textarea id="share-text" readonly rows="3"></textarea>
        </label>
        <p class="status" id="share-status" role="status"></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>《鸣潮》同人创作 · 仅供学习与娱乐</span>
    <small>开发中，不代表最终展示效果</small>
  </footer>
</body>
</html>
